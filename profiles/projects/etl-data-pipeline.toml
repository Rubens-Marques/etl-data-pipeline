# Fail-closed: any match marks every component affected.
global_paths = [
    "requirements.txt",
    "pytest.ini",
    "profiles/**",
    ".github/workflows/nexus-quality-gate.yml",
    "scripts/nexus_quality_gate.py",
  ]

[project]
id = "etl-data-pipeline"
repository = "Rubens-Marques/etl-data-pipeline"

[components.app]
paths = [
    "src/**",
    "tests/**",
  ]
checks = ["gate-contract", "trivy"]
images = []
